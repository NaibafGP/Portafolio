<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Synchronous language & theme hydration to eliminate FOUC / attribute flicker -->
    <script>
      (function() {
        try {
          var p = new URLSearchParams(window.location.search).get('lang');
          var s = localStorage.getItem('portfolio-lang');
          var l = (p === 'es' || p === 'en') ? p : ((s === 'es' || s === 'en') ? s : 'es');
          document.documentElement.lang = l;
          var t = localStorage.getItem('portfolio-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>

    <meta
      name="description"
      content="Fabian Garcia — Desarrollador de Software especializado en Backend (Java / Spring Boot, Python / Odoo) y Mobile (Kotlin / Jetpack Compose). Lima, Perú."
    />
    <title>Fabian Garcia — Desarrollador de Software | Backend & Mobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
